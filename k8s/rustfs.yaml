apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      securityContext:
        fsGroup: 10001
      initContainers:
      - name: volume-owner
        image: busybox:1.37
        command: ["chown", "10001:10001", "/data"]
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: storage
          mountPath: /data
      containers:
      - name: rustfs
        image: rustfs/rustfs:1.0.0
        env:
        - name: RUSTFS_VOLUMES
          value: /data
        - name: RUSTFS_ADDRESS
          value: "0.0.0.0:9000"
        - name: RUSTFS_CONSOLE_ENABLE
          value: "false"
        - name: RUSTFS_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: s3-access
              key: AWS_ACCESS_KEY_ID
        - name: RUSTFS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: s3-access
              key: AWS_SECRET_ACCESS_KEY
        ports:
        - name: s3
          containerPort: 9000
        readinessProbe:
          tcpSocket:
            port: s3
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 1Gi
        volumeMounts:
        - name: storage
          mountPath: /data
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: rustfs-data
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
spec:
  selector:
    app: rustfs
  ports:
  - name: s3
    port: 9000
    targetPort: s3
